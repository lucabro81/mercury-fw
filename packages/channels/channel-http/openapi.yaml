openapi: 3.1.0
info:
  title: Mercury HTTP surface
  version: 0.17.1
  description: >
    The HTTP surface of Mercury — the intended primary channel for a
    custom web UI. It is enabled by declaring the `http` channel in
    `mercury.config.ts`, together with an auth provider (`auth`): without one
    the surface doesn't start. CORS is
    enabled on every response (`Access-Control-Allow-Origin`, configurable via
    `HTTP_SURFACE_CORS_ORIGIN`, default `*`) and every route answers an `OPTIONS`
    preflight, so a browser UI on another origin can call it.


    ## Authentication

    Every route except this document, `/version` and the `OPTIONS` preflights needs
    `Authorization: Bearer <token>`. The app's auth provider decides what a
    valid token is (an OpenID Connect access token, a static test token); a
    missing or refused one gets `401` with `WWW-Authenticate: Bearer`, before
    anything runs.

    Then the core decides whether it talks to that person at all: someone the
    app's directory doesn't know gets `403` (unless the app lets unknown people
    in), and `503` when the directory can't be reached. Both carry
    `{ ok: false, error, reason }`, `error` being what to tell them.


    ## What a caller sees

    Every read is scoped to the caller: their own conversations, pending
    confirmations, tool calls and memory, and the wiki as they see it, the
    team's common area (`curated/`) plus their own notes (`personal/`).
    Someone else's data doesn't exist as far as a caller can tell.
    `/manifest` lists what the caller is offered, and only `/health` is the
    same for everyone.


    ## Conversations

    A conversation is identified by an opaque, client-owned `conversationId`
    and belongs to whoever opened it: Mercury's session key is
    `<caller id>:<conversationId>`, so the same id sent by someone else is a
    conversation of their own, and a confirmation token staged in one person's
    conversation is never found from another's. Omitting `conversationId` on
    `POST /turn` starts a fresh ephemeral conversation. The durable transcript
    of one of the caller's conversations is readable via `GET /conversation`,
    and the list of their conversations via `GET /conversations` (both backed
    by the verbatim archive; they degrade to empty when the vector store is
    unreachable).

    A conversation never ends: sent again with the same `conversationId`, a
    turn continues it however long after. Mercury frees a conversation's
    in-memory history once it has been idle a while; the next turn rebuilds
    it from the archive (a summary of its older part and its newest messages,
    within `HTTP_SURFACE_RESUME_MAX_CHARS`), so the model still knows what the
    person sees on screen.


    ## Streaming and cancellation

    `POST /turn` streams the answer as Server-Sent Events: reasoning and text
    arrive as **incremental deltas** (never a single finished block), followed by
    an authoritative `final` event. To cancel a turn whose generation is
    diverging, the client simply closes the connection — Mercury aborts the
    in-flight generation.


    ## Confirmation

    An irreversible action is never executed on the model's say-so: the turn
    emits a `pending` event carrying a one-time `token`. The client confirms by
    sending that token back — either as the `text` of a follow-up `POST /turn`,
    or via `POST /confirm`. An action can offer several `choices` (e.g. "only
    this time" / "always"), each with its own token: the caller sends back one,
    and the others die with it.


    Some actions hand their result back to the model instead of to the caller
    (a page read after the caller allowed it, for example). Confirming one by
    `POST /turn` streams the model's answer on that same stream; `POST /confirm`
    answers `resume: true`, and the client then opens
    `POST /turn { resume: true, conversationId }` to hear it. The answer waits
    five minutes and is heard once: later, after a restart, or a second time,
    that `final`'s text says it's no longer available.
security:
  - bearerAuth: []
servers:
  - url: http://localhost:4100
    description: Local/dev surface (HTTP_SURFACE_PORT, default 4100)
paths:
  /turn:
    post:
      summary: Run a conversational turn (SSE stream)
      description: >
        Runs one model turn and streams the result as `text/event-stream`. If
        `text` is a pending confirmation token it is resolved deterministically
        without ever consulting the model. Close the connection to cancel an
        in-flight turn. When the confirmation hands its result back to the
        model, the model's answer to it streams instead. With `resume: true`
        and no `text`, the turn is the one a `/confirm` answered `resume: true`
        for. With `opening: true` and no `text`, the assistant
        speaks first in the conversation named (right after someone signs
        in): it does only for someone it doesn't know the name of, asking how
        to call them, and otherwise the stream carries a single `final` with
        an empty text. Every text the person reads that isn't the model's (a
        refusal, a status line, a confirmation's reply) is in their language:
        the one they saved, else the one `Accept-Language` asks for, else the
        instance's default. The model reads the person's message after when
        and where they wrote it: in the time zone they saved, else the one
        `X-Time-Zone` says, else the instance's.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/TimeZone"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TurnRequest"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotAdmitted"
        "503":
          $ref: "#/components/responses/NotAdmitted"
        "200":
          description: >
            An SSE stream. Each event is one of the types in `TurnEvent`:
            `reasoning`/`reasoning_end`, `text` (incremental deltas), `tool`/
            `tool_finish` (status of a tool call), `pending` (a staged
            confirm-required action, with its command, its token and the
            choices it offers), `login` (a
            service the caller has to log in to first, with the link to open),
            `final` (the
            authoritative complete answer), and `error`.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/TurnEvent"
        "400":
          description: Missing/invalid body, an opening or a resumed turn without a conversationId, or a conversationId with characters outside the allowed ones.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /confirm:
    post:
      summary: Confirm a staged irreversible action
      description: >
        Runs a one-time confirmation token through the same mechanism the
        bare-token-in-`text` path uses, keyed on the caller's own conversation
        (`<caller id>:<conversationId>`). Never touches the model. The reply
        is in the caller's language, as on `/turn`.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmRequest"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotAdmitted"
        "503":
          $ref: "#/components/responses/NotAdmitted"
        "200":
          description: >
            `resolved: true` (with the reply `text`) when the token was a pending
            confirmation, `resolved: false` when it was not (unknown, expired, or
            already used). `resolved: true` with `resume: true` and no `text`
            when the action handed its result back to the model: the answer
            comes from `POST /turn { resume: true, conversationId }`.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmResult"
        "400":
          description: Missing token or conversationId, or a conversationId with characters outside the allowed ones.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /link:
    post:
      summary: A code for linking another account to the caller
      description: >
        A one-time code (`xxxx-xxxx-xxxx`, valid for ten minutes) the person
        sends from another account, on any channel, twice: the first time
        Mercury says whom the account would be linked to, the second time it
        links it. From then on both accounts are one person. Only the caller
        sees the code; the model never does.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotAdmitted"
        "503":
          $ref: "#/components/responses/NotAdmitted"
        "400":
          description: No code for this caller, with the reason.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: The code and when it expires.
          content:
            application/json:
              schema:
                type: object
                required: [ok, code, expiresAt]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  code:
                    type: string
                    pattern: "^[A-Za-z0-9]{4}-[A-Za-z0-9]{4}-[A-Za-z0-9]{4}$"
                  expiresAt:
                    type: string
                    format: date-time
  /conversation:
    get:
      summary: A conversation's durable transcript
      parameters:
        - name: id
          in: query
          required: true
          description: The caller's `conversationId`, as `/conversations` lists it.
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{1,128}$"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 200
        - name: offset
          in: query
          required: false
          description: Opaque pagination cursor from a previous page's `nextOffset`.
          schema:
            type: string
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotAdmitted"
        "503":
          $ref: "#/components/responses/NotAdmitted"
        "200":
          description: The conversation's messages in chronological order; none when it isn't one of the caller's.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationPage"
        "400":
          description: Missing or malformed `?id`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /conversations:
    get:
      summary: List the caller's conversations (most-recently-active first)
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotAdmitted"
        "503":
          $ref: "#/components/responses/NotAdmitted"
        "200":
          description: The conversation list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationList"
  /health:
    get:
      summary: Liveness/health of Mercury and its dependencies
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotAdmitted"
        "503":
          $ref: "#/components/responses/NotAdmitted"
        "200":
          description: Health snapshot.
          content:
            application/json:
              schema:
                type: object
  /manifest:
    get:
      summary: The plugins, tools and skills the caller is offered
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotAdmitted"
        "503":
          $ref: "#/components/responses/NotAdmitted"
        "200":
          description: Plugin manifest.
          content:
            application/json:
              schema:
                type: object
  /confirmations:
    get:
      summary: The caller's pending confirmations (tokens redacted)
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotAdmitted"
        "503":
          $ref: "#/components/responses/NotAdmitted"
        "200":
          description: Pending confirmations.
          content:
            application/json:
              schema:
                type: object
  /me:
    get:
      summary: Who the caller is to the assistant
      description: >
        How the caller asked to be called, `null` when they never said: a UI
        asks for an opening turn after a sign-in only then. Also the language
        they asked the assistant to use and the time zone they saved, `null`
        when they never said (missing on a core that doesn't know them). Not
        there on an older core, which can't say.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotAdmitted"
        "503":
          $ref: "#/components/responses/NotAdmitted"
        "200":
          description: The caller's name, language and time zone, or null.
          content:
            application/json:
              schema:
                type: object
                required: [ok, name]
                properties:
                  ok:
                    type: boolean
                  name:
                    type: [string, "null"]
                  language:
                    type: [string, "null"]
                    description: A language tag such as `it` or `pt-br`, one the instance ships.
                  timeZone:
                    type: [string, "null"]
                    description: The time zone's IANA name, such as `Europe/Rome`.
    patch:
      summary: Saves the caller's time zone
      description: >
        The time zone the caller is in, by its IANA name, for a UI's settings:
        from then on their turns are stamped with the time there, whatever
        `X-Time-Zone` says. Saved as the IANA list writes it (`europe/rome` is
        `Europe/Rome`). Not there on a core without settings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timeZone]
              properties:
                timeZone:
                  type: string
                  description: An IANA name such as `Europe/Rome`; a fixed offset (`+02:00`) isn't one.
      responses:
        "400":
          description: The body has no `timeZone`, or it isn't a zone's name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotAdmitted"
        "503":
          $ref: "#/components/responses/NotAdmitted"
        "200":
          description: The time zone as saved.
          content:
            application/json:
              schema:
                type: object
                required: [ok, timeZone]
                properties:
                  ok:
                    type: boolean
                  timeZone:
                    type: string
  /tool-log:
    get:
      summary: The tool calls made in the caller's recent turns
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotAdmitted"
        "503":
          $ref: "#/components/responses/NotAdmitted"
        "200":
          description: Tool log.
          content:
            application/json:
              schema:
                type: object
  /wiki/list:
    get:
      summary: List the wiki files the caller can see (`curated/` and `personal/`)
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotAdmitted"
        "503":
          $ref: "#/components/responses/NotAdmitted"
        "200":
          description: File list.
          content:
            application/json:
              schema:
                type: object
  /wiki/read:
    get:
      summary: Read one wiki file the caller can see
      parameters:
        - name: path
          in: query
          required: true
          description: A path as `/wiki/list` gives it, e.g. `curated/team.md` or `personal/notes/plan.md`.
          schema:
            type: string
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotAdmitted"
        "503":
          $ref: "#/components/responses/NotAdmitted"
        "200":
          description: File content.
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Missing `?path`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such file among those the caller can see.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /wiki/grep:
    get:
      summary: Grep the wiki files the caller can see
      parameters:
        - name: pattern
          in: query
          required: true
          description: A regular expression, matched line by line, case ignored.
          schema:
            type: string
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotAdmitted"
        "503":
          $ref: "#/components/responses/NotAdmitted"
        "200":
          description: Matches.
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Missing `?pattern`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /memory/scroll:
    get:
      summary: Scroll the caller's points in a memory collection
      parameters:
        - name: collection
          in: query
          required: true
          description: One of the collections kept per person (the verbatim archive, episodic memory, semantic facts), by its configured name.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: string
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotAdmitted"
        "503":
          $ref: "#/components/responses/NotAdmitted"
        "200":
          description: A page of points.
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Missing `?collection`, or one that isn't kept per person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /login/callback:
    get:
      summary: Where a person comes back after logging in to a service
      description: >
        Mounted when `HTTP_SURFACE_PUBLIC_URL` is set. The service sends the
        person's browser here with `code` and `state` (or `error`); the
        single-use state is the credential, so no bearer token is needed.
        Answers with a plain-text page, in the language the browser asks for
        (`Accept-Language`), else the instance's default; a failed login reads
        in the language of the person who started it.
      security: []
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "200":
          description: Logged in.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            text/plain:
              schema: { type: string }
        "400":
          description: Refused, expired, already used, or missing code/state.
          headers:
            Content-Language:
              description: Set on a denied or incomplete login (the browser's language); not on a failed one, which reads in the language of whoever started it.
              schema:
                type: string
          content:
            text/plain:
              schema: { type: string }
  /version:
    get:
      summary: Which Mercury this is
      description: >
        The framework's version, `major.minor.patch`, for a UI to show, and
        the app's own when its config declares one (`app.version`, its
        `package.json`'s, shown as the app has it). Needs no bearer token.
      security: []
      responses:
        "200":
          description: The framework's version, and the app's when it declares one.
          content:
            application/json:
              schema:
                type: object
                required: [ok, version]
                properties:
                  ok: { type: boolean, const: true }
                  version:
                    type: string
                    pattern: '^\d+\.\d+\.\d+$'
                    examples: ["0.59.0"]
                  app:
                    type: object
                    description: The app's own version; absent when the app declares none.
                    required: [version]
                    properties:
                      version:
                        type: string
                        description: As the app's `package.json` has it, not checked.
                        examples: ["1.2.0"]
  /openapi.yaml:
    get:
      summary: This OpenAPI document
      security: []
      responses:
        "200":
          description: The raw OpenAPI YAML.
          content:
            text/yaml:
              schema:
                type: string
components:
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: >
        The languages the client prefers, as browsers send them
        (`it-IT,it;q=0.9,en;q=0.8`). Used for the texts the person reads when
        they saved no language of their own; a language the instance doesn't
        ship is passed over.
      schema:
        type: string
    TimeZone:
      name: X-Time-Zone
      in: header
      required: false
      description: >
        The time zone the client is in, by its IANA name, as a browser gives
        it (`Intl.DateTimeFormat().resolvedOptions().timeZone`). Used for the
        turn's time when the person saved no time zone of their own; a name
        that isn't a zone is passed over.
      schema:
        type: string
  headers:
    ContentLanguage:
      description: >
        The language of the caller's texts as it stood when the response
        started, one the instance ships (`en`, `it`); a person who picks
        another language during a turn gets it from the next one.
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A token the app's auth provider accepts.
  responses:
    Unauthorized:
      description: >
        No `Authorization` header, or a token the auth provider refused.
        Carries `WWW-Authenticate: Bearer`.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            enum: [Bearer]
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotAdmitted:
      description: >
        An authenticated caller the core won't talk to: `403` when the app's
        directory doesn't know them, `503` when it can't be reached. Nothing
        behind the route runs. `error` is in the language `Accept-Language`
        asks for, which `Content-Language` names.
      headers:
        Content-Language:
          $ref: "#/components/headers/ContentLanguage"
      content:
        application/json:
          schema:
            type: object
            required: [ok, error, reason]
            properties:
              ok:
                type: boolean
                enum: [false]
              error:
                type: string
                description: What to tell the caller.
              reason:
                type: string
                enum: [unknown, unavailable]
  schemas:
    TurnRequest:
      type: object
      properties:
        text:
          type: string
          description: The user's message, or a bare confirmation token. Required, unless `opening` or `resume` is true.
        opening:
          type: boolean
          enum: [true]
          description: The assistant speaks first in `conversationId`, which is then required; `text` is ignored.
        resume:
          type: boolean
          enum: [true]
          description: "The turn a `/confirm` answered `resume: true` for, in `conversationId`, which is then required; `text` is ignored."
        conversationId:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,128}$"
          description: Opaque, client-owned; letters, digits, `-` and `_` (a UUID fits). Omit to start a fresh ephemeral conversation, which can't be continued.
    TurnEvent:
      type: object
      description: The shape carried by each SSE `data:` line, per event type.
      properties:
        chunk:
          type: string
          description: On `text`/`reasoning` — an incremental delta.
        id:
          type: string
          description: On `reasoning`/`reasoning_end` — the reasoning block id.
        failed:
          type: boolean
          description: On `reasoning_end`.
        label:
          type: string
          description: On `tool` — a human status label.
        detail:
          type: string
          description: On `tool` — optional detail.
        name:
          type: string
          description: On `tool` — the tool the model called (e.g. `jiraCommand`); absent for Mercury's own memory notes.
        toolCallId:
          type: string
          description: On `tool`/`tool_finish`.
        outcome:
          type: string
          description: On `tool_finish` — success/failed.
        command:
          type: string
          description: On `pending` — the staged action's summary.
        token:
          type: string
          description: On `pending` — the one-time confirmation token (the first choice's).
        choices:
          type: array
          description: On `pending` — every way to answer, in order, each label in the caller's language; a plain staging has one with an empty label, which the UI words itself (a "Confirm" button).
          items:
            type: object
            required: [token, label]
            properties:
              token:
                type: string
              label:
                type: string
        service:
          type: string
          description: On `login` — the service the caller has to log in to.
        url:
          type: string
          description: On `login` — the link the caller opens to log in; it comes back to `/login/callback`.
        text:
          type: string
          description: On `final` — the authoritative complete answer.
        pendingNote:
          type: string
          description: >
            On `final`, when the model wrote nothing because the turn staged an
            action: the stand-in sentence `text` begins with (followed by any
            list the turn surfaced). A UI showing its own confirmation hides
            it; the conversation's transcript keeps it.
        message:
          type: string
          description: On `error` — the failure message.
    ConfirmRequest:
      type: object
      required: [token, conversationId]
      properties:
        token:
          type: string
        conversationId:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,128}$"
    ConfirmResult:
      type: object
      required: [ok, resolved]
      properties:
        ok:
          type: boolean
        resolved:
          type: boolean
        text:
          type: string
          description: The confirmation reply, present when `resolved` is true and `resume` isn't.
        resume:
          type: boolean
          enum: [true]
          description: "The action handed its result back to the model; its answer comes from `POST /turn { resume: true, conversationId }`."
    Message:
      type: object
      required: [role, content, timestamp]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          description: The message as the person saw it. For an answer, the lists the turn showed after it are included, as in the turn's `final` text.
        timestamp:
          type: string
          description: ISO 8601, millisecond precision — the durable ordering key.
    ConversationPage:
      type: object
      required: [ok, messages]
      properties:
        ok:
          type: boolean
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        nextOffset:
          description: Opaque cursor for the next page, or null when exhausted.
          oneOf:
            - type: string
            - type: "null"
    ConversationSummary:
      type: object
      required: [conversationId, lastTimestamp, preview]
      properties:
        conversationId:
          type: string
        lastTimestamp:
          type: string
        preview:
          type: string
    ConversationList:
      type: object
      required: [ok, conversations]
      properties:
        ok:
          type: boolean
        conversations:
          type: array
          items:
            $ref: "#/components/schemas/ConversationSummary"
    Error:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          enum: [false]
        error:
          type: string
