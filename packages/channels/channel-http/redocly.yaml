# Lint config for the HTTP surface's OpenAPI spec. `minimal` errors only on
# genuinely broken specs; the overrides below drop rules that don't fit this
# surface (no license, no operation ids, the example.com server rule) while
# keeping structural validation on.
extends:
  - minimal
rules:
  info-license: off
  operation-operationId: off
  operation-4xx-response: off
  no-unused-components: warn
