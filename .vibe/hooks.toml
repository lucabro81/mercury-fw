# Mercury workflow hooks — automated guard-rails for the development workflow.
# See AGENTS.md for the full workflow.
#
# Command paths are absolute (git rev-parse --show-toplevel) and guarded by
# a conditional test: if the cwd is not inside this repo, the hooks fail open
# (they do not block tool calls).

# 1. Block direct commits on main/master
[[hooks]]
name = "block-commit-on-main"
type = "pre_tool"
match = "re:(bash|process\\.start)"
command = "ROOT=$(git rev-parse --show-toplevel 2>/dev/null) && test -f \"$ROOT/.vibe/hooks.toml\" && python3 \"$ROOT/.vibe/tools/block_commit_on_main.py\" || true"
description = "Block git commit on main: only commit on feat/<N>-<slug>"

# 2. Block rm -rf and variants
[[hooks]]
name = "block-rm-rf"
type = "pre_tool"
match = "re:(bash|process\\.start)"
command = "ROOT=$(git rev-parse --show-toplevel 2>/dev/null) && test -f \"$ROOT/.vibe/hooks.toml\" && python3 \"$ROOT/.vibe/tools/block_rm_rf.py\" || true"
description = "Block rm -rf: use git rm for tracked files"

# 3. Warn when committing code without a changeset
[[hooks]]
name = "suggest-changeset"
type = "pre_tool"
match = "re:(bash|process\\.start)"
command = "ROOT=$(git rev-parse --show-toplevel 2>/dev/null) && test -f \"$ROOT/.vibe/hooks.toml\" && python3 \"$ROOT/.vibe/tools/suggest_changeset.py\" || true"
description = "Warn when committing code without a changeset"

# 4. Remind to run tests and typecheck after editing .ts files
[[hooks]]
name = "suggest-test-after-ts-edit"
type = "post_tool"
match = "re:(edit|write_file)"
command = "ROOT=$(git rev-parse --show-toplevel 2>/dev/null) && test -f \"$ROOT/.vibe/hooks.toml\" && python3 \"$ROOT/.vibe/tools/suggest_test_after_ts.py\" || true"
description = "After editing a .ts file, remind to run typecheck and tests"
