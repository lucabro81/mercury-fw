name: API docs (GitHub Pages)

# Publishes the HTTP surface's OpenAPI spec as a rendered docs page. The spec
# (packages/channels/channel-http/openapi.yaml) is the single source of truth;
# this lints it and renders it with Redocly, then deploys to GitHub Pages.
#
# One-time setup: repo Settings -> Pages -> Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - packages/channels/channel-http/openapi.yaml
      - packages/channels/channel-http/redocly.yaml
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # Redocly pinned to 2.69.0, as in apps/docs/scripts/api.ts: 2.70.0 writes
      # the page's internal links as root-relative paths instead of fragments
      # (#307). Lift both pins once a later release builds fragment links again.
      - name: Lint the OpenAPI spec
        working-directory: packages/channels/channel-http
        run: bunx @redocly/cli@2.69.0 lint openapi.yaml
      - name: Render the docs page
        working-directory: packages/channels/channel-http
        run: bunx @redocly/cli@2.69.0 build-docs openapi.yaml -o "$GITHUB_WORKSPACE/site/index.html"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
