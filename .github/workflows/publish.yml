name: Publish to npm

# Publishes every public workspace whose version isn't on npm yet
# (scripts/publish.ts: type declarations, pack check, bun pm pack, npm publish
# in dependency order). It runs on every push to main that touches a
# package.json, not on tags: GitHub creates no events for tags when more than
# three are pushed at once, and a release pushes one per package. Only a
# release changes versions, so any other run finds everything already
# published and does nothing.
#
# Then the releases job creates the GitHub Release of each tag on the
# release commit (scripts/github-releases.ts), and the site job publishes
# the docs site (apps/docs) on GitHub Pages, its changelog included: only
# when packages were published, so the site always describes what is on npm.
# One-time setup: repo Settings -> Pages -> Source = "GitHub Actions".
#
# No token: npm trusts this workflow as the packages' publisher (trusted
# publishing, OIDC), configured per package with `npm trust github`; a
# brand-new package needs its first version published by hand before that
# (see the Versioning section of CLAUDE.md).

on:
  push:
    branches: [main]
    paths:
      - "**/package.json"
      - .github/workflows/publish.yml
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: pack and check everything, publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # Typecheck and tests on any branch; a dispatched dry run also packs every
  # package and runs npm publish --dry-run, which needs no credentials.
  check:
    runs-on: ubuntu-latest
    steps:
      # A real publish only ever runs from main: from another branch, fail
      # loudly instead of skipping the publish job and reporting green.
      - name: Refuse a real publish outside main
        if: ${{ github.ref != 'refs/heads/main' && github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
        run: |
          echo "::error::A real publish runs only from main; dispatch it from main, or keep dry_run."
          exit 1
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Dry run
        if: ${{ inputs.dry_run }}
        run: bun scripts/publish.ts --dry-run

  publish:
    needs: check
    if: ${{ github.ref == 'refs/heads/main' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # How many packages this run published: the site job runs only after a
    # release, never for a push that published nothing.
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.x"
      # Node 24 ships an npm with trusted publishing (11.5.1 or later). No
      # registry-url here: it writes an .npmrc expecting a token.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Publish
        id: publish
        run: bun scripts/publish.ts

  # The GitHub Release of each tag on the release commit, the unified
  # changelog the docs site reads (scripts/github-releases.ts). After the
  # publish, so a Release exists only for what is on npm; a rerun creates
  # only what's missing. It reads the tags on the pushed commit, where
  # scripts/release.ts puts them: a release that reached main another way
  # gets its Releases from the script run by hand.
  releases:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The whole history, for the tags.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.x"
      - name: Create the Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/github-releases.ts

  # The docs site on GitHub Pages, built from the release commit after its
  # Releases exist, so the changelog and the footer's version show it. The
  # HTTP API reference is part of the build (apps/docs/scripts/api.ts). Only
  # the build: docs.yml already checks every change to the site.
  site:
    needs: [publish, releases]
    if: ${{ needs.publish.outputs.published > 0 }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The whole history, for the tags that date the changelog's releases.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.x"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build the site
        working-directory: apps/docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES_REQUIRED: "1"
        run: bun run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist
      - id: deployment
        uses: actions/deploy-pages@v4
