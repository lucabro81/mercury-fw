name: Docs site

# Checks the documentation site (apps/docs) on every change that can alter it:
# its unit tests (catalog, changelog, theme contrast), the typecheck, the build,
# and on the built site an axe audit of every kind of page in both themes plus
# the internal links. A failure blocks the change. Publishing the site is not
# here: it will run after a release, from publish.yml.

on:
  pull_request:
    paths:
      - apps/docs/**
      - apps/cli/src/catalog.ts
      - packages/*/*/package.json
      - packages/libs/core/index.ts
      - packages/types/**
      - packages/channels/channel-http/openapi.yaml
      - .github/workflows/docs.yml
  push:
    branches: [main]
    paths:
      - apps/docs/**
      - apps/cli/src/catalog.ts
      - packages/*/*/package.json
      - packages/libs/core/index.ts
      - packages/types/**
      - packages/channels/channel-http/openapi.yaml
      - .github/workflows/docs.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/docs
    env:
      # The changelog page reads the repository's releases.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.x"
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun test src
      - run: bun run typecheck
      - run: bun run build
      - run: bunx --bun playwright install --with-deps chromium
      - run: bun run test:a11y
